<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>线路选择中</title>
<style>
  :root {
    --primary: #2563eb;
    --text: #ffffff;
    --text-light: #e2e8f0;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-image: url("https://picsum.photos/id/1018/1920/1080");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: var(--text);
    position: relative;
  }
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-color: rgba(0,0,0,0.45);
    z-index: 0;
  }
  .container {
    text-align: center;
    padding: 2rem;
    width: 100%;
    max-width: 400px;
    position: relative;
    z-index: 1;
  }
  .loader {
    width: 40px;
    height: 40px;
    margin: 0 auto 20px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top: 4px solid var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .status {
    font-size: 1.1rem;
    font-weight: 500;
    margin-bottom: 10px;
  }
  .detail {
    font-size: 0.85rem;
    color: var(--text-light);
    line-height: 1.5;
    word-break: break-all;
  }
  .btn-group{
    margin-top:24px;
    display:flex;
    gap:12px;
    justify-content:center;
  }
  button{
    padding:8px 16px;
    border:none;
    border-radius:6px;
    background:#2563eb;
    color:white;
    cursor:pointer;
  }
  button:hover{
    background:#1d4ed8;
  }
  .hidden {
    display: none;
  }
</style>
</head>
<body>
<div class="container">
  <div class="loader" id="loader"></div>
  <div class="status" id="status">优先访问内网</div>
  <div class="detail" id="detail">正在尝试：http://10.0.0.200:7000</div>
  <div class="btn-group hidden" id="btnBox">
    <button onclick="goLan()">👉 重试内网</button>
    <button onclick="goWan()">🌐 访问外网</button>
  </div>
</div>

<script>
(function () {
  const URL_LAN = "http://10.0.0.200:7000";
  const URL_WAN = "https://home.myxx.site:7002";
  const TIMEOUT = 2200;

  const statusEl = document.getElementById("status");
  const detailEl = document.getElementById("detail");
  const loaderEl = document.getElementById("loader");
  const btnBox = document.getElementById("btnBox");

  function goLan(){window.location.replace(URL_LAN);}
  function goWan(){window.location.replace(URL_WAN);}

  // 直接跳转内网，超时后停止，展示按钮
  const timeoutTimer = setTimeout(()=>{
    loaderEl.classList.add('hidden');
    statusEl.textContent = "⚠️ 内网超时无法连接";
    detailEl.textContent = "可重试内网，或切换外网";
    btnBox.classList.remove('hidden');
  }, TIMEOUT);

  // 页面加载立刻跳内网
  goLan();
})();
</script>
</body>
</html>
