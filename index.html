<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>正在选择最佳线路...</title>
<style>
  :root {
    --primary: #2563eb;
    --bg: #f8fafc;
    --text: #334155;
    --text-light: #94a3b8;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
  }
  .container {
    text-align: center;
    padding: 2rem;
    width: 100%;
    max-width: 400px;
  }
  .loader {
    width: 40px;
    height: 40px;
    margin: 0 auto 20px;
    border: 4px solid #e2e8f0;
    border-top: 4px solid var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .status {
    font-size: 1.1rem;
    font-weight: 500;
    margin-bottom: 10px;
  }
  .detail {
    font-size: 0.85rem;
    color: var(--text-light);
    line-height: 1.5;
    word-break: break-all;
  }
  .error-msg {
    color: #ef4444;
    margin-top: 15px;
    font-size: 0.9rem;
  }
  .hidden {
    display: none;
  }
</style>
</head>
<body>

<div class="container">
  <div class="loader" id="loader"></div>
  <div class="status" id="status">正在检测局域网线路...</div>
  <div class="detail" id="detail">优先尝试连接内网服务</div>
  <div class="error-msg hidden" id="errorMsg">内网与外网线路均无法访问，请检查您的网络或稍后重试。</div>
</div>

<script>
(function () {
  // ==========================================
  // URL_B：局域网（优先） URL_A：外网（备用）
  // ==========================================
  const URL_A = "https://home.myxx.site:7002"; 
  const URL_B = "http://10.0.0.200:7002";
  
  // 检测超时时间（毫秒），建议 3000-5000 之间
  const TIMEOUT_MS = 4000; 
  // ==========================================

  const statusEl = document.getElementById("status");
  const detailEl = document.getElementById("detail");
  const loaderEl = document.getElementById("loader");
  const errorMsgEl = document.getElementById("errorMsg");

  /**
   * 核心检测函数
   * 原理：使用图片请求(Image)或无跨域头请求(fetch no-cors)
   * 只要能收到响应，就说明网络可达
   */
  function checkConnection(url) {
    return new Promise((resolve) => {
      const startTime = performance.now();
      let isResolved = false;

      // 超时控制器
      const timer = setTimeout(() => {
        if (!isResolved) {
          isResolved = true;
          resolve({ url, ok: false, time: Infinity });
        }
      }, TIMEOUT_MS);

      // 策略 1: Image 探测 favicon.ico，不受CORS限制
      const img = new Image();
      
      img.onload = function () {
        if (isResolved) return;
        clearTimeout(timer);
        isResolved = true;
        const time = performance.now() - startTime;
        resolve({ url, ok: true, time });
      };

      img.onerror = function () {
        if (isResolved) return;
        clearTimeout(timer);
        isResolved = true;
        // favicon探测失败，走fetch兜底
        fetchFallback(url, startTime, resolve);
      };

      const targetUrl = new URL(url);
      img.src = targetUrl.origin + "/favicon.ico?t=" + Date.now();
    });
  }

  // 兜底策略：Fetch no-cors HEAD
  function fetchFallback(url, startTime, resolve) {
    const controller = new AbortController();
    const fetchTimer = setTimeout(() => controller.abort(), TIMEOUT_MS);

    fetch(url, { 
      method: 'HEAD', 
      mode: 'no-cors', 
      signal: controller.signal,
      cache: 'no-store'
    })
    .then(() => {
      clearTimeout(fetchTimer);
      const time = performance.now() - startTime;
      resolve({ url, ok: true, time });
    })
    .catch(() => {
      clearTimeout(fetchTimer);
      resolve({ url, ok: false, time: Infinity });
    });
  }

  // 主逻辑：串行，先内网，失败再外网
  async function init() {
    statusEl.textContent = "正在检测局域网线路...";
    detailEl.textContent = `内网地址：${URL_B}`;

    // 第一步：先测局域网
    const resultB = await checkConnection(URL_B);
    console.log("【内网线路B】", resultB);

    if (resultB.ok) {
      statusEl.textContent = "局域网连通成功，正在跳转内网服务";
      detailEl.innerHTML = `内网延迟：${Math.round(resultB.time)}ms`;
      setTimeout(() => window.location.replace(URL_B), 800);
      return;
    }

    // 内网不通，继续检测外网
    statusEl.textContent = "局域网无法访问，正在切换检测外网线路...";
    detailEl.textContent = `外网地址：${URL_A}`;
    const resultA = await checkConnection(URL_A);
    console.log("【外网线路A】", resultA);

    if (resultA.ok) {
      statusEl.textContent = "外网线路连通成功，正在跳转外网服务";
      detailEl.innerHTML = `外网延迟：${Math.round(resultA.time)}ms`;
      setTimeout(() => window.location.replace(URL_A), 800);
      return;
    }

    // 内网外网全都不通
    loaderEl.classList.add("hidden");
    statusEl.textContent = "所有线路检测失败";
    detailEl.classList.add("hidden");
    errorMsgEl.classList.remove("hidden");
  }

  // 启动
  init();
})();
</script>
</body>
</html>
