<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>线路选择中</title>
<style>
  :root {
    --primary: #2563eb;
    --bg: #f8fafc;
    --text: #ffffff;
    --text-light: #e2e8f0;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    /* ========== 背景图设置 ========== */
    background-image: url("https://pic1.zhimg.com/100/v2-84da182ca211f4717baaeac0657f90fc_r.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: var(--text);
    position: relative;
  }
  /* 半透明遮罩，防止文字看不清 */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-color: rgba(0,0,0,0.45);
    z-index: 0;
  }
  .container {
    text-align: center;
    padding: 2rem;
    width: 100%;
    max-width: 400px;
    position: relative;
    z-index: 1;
  }
  .loader {
    width: 40px;
    height: 40px;
    margin: 0 auto 20px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top: 4px solid var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .status {
    font-size: 1.1rem;
    font-weight: 500;
    margin-bottom: 10px;
  }
  .detail {
    font-size: 0.85rem;
    color: var(--text-light);
    line-height: 1.5;
    word-break: break-all;
  }
  .btn-group{
    margin-top:24px;
    display:flex;
    gap:12px;
    justify-content:center;
  }
  button{
    padding:8px 16px;
    border:none;
    border-radius:6px;
    background:#2563eb;
    color:white;
    cursor:pointer;
  }
  button:hover{
    background:#1d4ed8;
  }
  .hidden {
    display: none;
  }
</style>
</head>
<body>
<div class="container">
  <div class="loader" id="loader"></div>
  <div class="status" id="status">优先尝试内网线路</div>
  <div class="detail" id="detail">内网地址：http://10.0.0.200:7000</div>
  <div class="btn-group hidden" id="btnBox">
    <button onclick="goLan()">👉 手动访问内网</button>
    <button onclick="goWan()">🌐 手动访问外网</button>
  </div>
</div>

<script>
(function () {
  const URL_LAN = "http://10.0.0.200:7000";
  const URL_WAN = "https://home.myxx.site:7002";
  const TIMEOUT = 2200; // 内网探测超时时间，单位毫秒
  let timer = null;

  const statusEl = document.getElementById("status");
  const detailEl = document.getElementById("detail");
  const loaderEl = document.getElementById("loader");
  const btnBox = document.getElementById("btnBox");

  function goLan(){window.location.replace(URL_LAN);}
  function goWan(){window.location.replace(URL_WAN);}

  // 探测内网地址
  async function testLan() {
    const controller = new AbortController();
    timer = setTimeout(()=>{
      controller.abort();
      // 内网超时，切换外网
      statusEl.textContent = "⚠️ 内网不可达，切换外网";
      detailEl.textContent = `外网地址：${URL_WAN}`;
      setTimeout(goWan, 600);
    }, TIMEOUT);

    try {
      const res = await fetch(URL_LAN, {
        mode: "no-cors",
        signal: controller.signal
      });
      // fetch 没超时 = 内网通，直接跳转内网
      clearTimeout(timer);
      statusEl.textContent = "✅ 内网连通成功，跳转内网";
      setTimeout(goLan, 600);
    } catch (e) {
      // 被abort是超时，已经在上面处理；其他错误=内网不通
      if(e.name !== "AbortError"){
        clearTimeout(timer);
        statusEl.textContent = "⚠️ 内网无法访问，切换外网";
        detailEl.textContent = `外网地址：${URL_WAN}`;
        setTimeout(goWan, 600);
      }
    }
  }
  testLan().catch(()=>{
    // 兜底：探测异常，展示手动按钮
    loaderEl.classList.add('hidden');
    statusEl.textContent = "⚠️ 自动探测失败";
    detailEl.textContent = "请手动选择线路";
    btnBox.classList.remove('hidden');
  });
})();
</script>
</body>
</html>
