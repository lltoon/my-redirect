<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>正在选择最佳线路...</title>
<style>
  :root {
    --primary: #2563eb;
    --bg: #f8fafc;
    --text: #334155;
    --text-light: #94a3b8;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
  }
  .container {
    text-align: center;
    padding: 2rem;
    width: 100%;
    max-width: 400px;
  }
  .loader {
    width: 40px;
    height: 40px;
    margin: 0 auto 20px;
    border: 4px solid #e2e8f0;
    border-top: 4px solid var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .status {
    font-size: 1.1rem;
    font-weight: 500;
    margin-bottom: 10px;
  }
  .detail {
    font-size: 0.85rem;
    color: var(--text-light);
    line-height: 1.5;
    word-break: break-all;
  }
  .error-msg {
    color: #ef4444;
    margin-top: 15px;
    font-size: 0.9rem;
  }
  .hidden {
    display: none;
  }
</style>
</head>
<body>

<div class="container">
  <div class="loader" id="loader"></div>
  <div class="status" id="status">正在检测网络连通性...</div>
  <div class="detail" id="detail">请稍候，系统正在为您选择最快的线路。</div>
  <div class="error-msg hidden" id="errorMsg">两个链接均无法访问，请检查您的网络或稍后重试。</div>
</div>

<script>
(function () {
  // ==========================================
  // 在这里修改你的两个目标网址 (记得带上 https://)
  // ==========================================
  const URL_A = "https://home.myxx.site:7002"; 
  const URL_B = "http://10.0.0.200:7002";
  
  // 检测超时时间（毫秒），建议 3000-5000 之间
  const TIMEOUT_MS = 4000; 
  // ==========================================

  const statusEl = document.getElementById("status");
  const detailEl = document.getElementById("detail");
  const loaderEl = document.getElementById("loader");
  const errorMsgEl = document.getElementById("errorMsg");

  /**
   * 核心检测函数
   * 原理：使用图片请求(Image)或无跨域头请求(fetch no-cors)
   * 只要能收到响应，就说明网络可达（对于判断“能不能连上”非常有效）
   */
  function checkConnection(url) {
    return new Promise((resolve) => {
      const startTime = performance.now();
      let isResolved = false;

      // 超时控制器
      const timer = setTimeout(() => {
        if (!isResolved) {
          isResolved = true;
          resolve({ url, ok: false, time: Infinity });
        }
      }, TIMEOUT_MS);

      // 策略 1: 尝试使用 Image 对象探测（不受 CORS 限制，非常稳定）
      // 我们借用目标网站的 favicon.ico 来测试
      const img = new Image();
      
      img.onload = function () {
        if (isResolved) return;
        clearTimeout(timer);
        isResolved = true;
        const time = performance.now() - startTime;
        resolve({ url, ok: true, time });
      };

      img.onerror = function () {
        if (isResolved) return;
        clearTimeout(timer);
        isResolved = true;
        // 图片加载失败，可能目标网站没有 favicon，或者真的不通
        // 保险起见，使用 fetch no-cors 再兜底测一次
        fetchFallback(url, startTime, resolve);
      };

      // 拼接 favicon 地址并开始加载，加时间戳避免缓存
      const targetUrl = new URL(url);
      img.src = targetUrl.origin + "/favicon.ico?t=" + Date.now();
    });
  }

  // 兜底策略：Fetch no-cors（只要不发跨域报错就算通）
  function fetchFallback(url, startTime, resolve) {
    const controller = new AbortController();
    const fetchTimer = setTimeout(() => controller.abort(), TIMEOUT_MS);

    fetch(url, { 
      method: 'HEAD', 
      mode: 'no-cors', 
      signal: controller.signal,
      cache: 'no-store'
    })
    .then(() => {
      clearTimeout(fetchTimer);
      const time = performance.now() - startTime;
      resolve({ url, ok: true, time });
    })
    .catch(() => {
      clearTimeout(fetchTimer);
      resolve({ url, ok: false, time: Infinity });
    });
  }

  // 执行主逻辑
  async function init() {
    statusEl.textContent = "正在并发测试两条线路...";
    
    // 1. 并发测试两个链接
    const [resultA, resultB] = await Promise.all([
      checkConnection(URL_A),
      checkConnection(URL_B)
    ]);

    // 2. 打印调试信息（方便在 CloudBase 控制台或浏览器 F12 查看）
    console.log("线路 A:", resultA);
    console.log("线路 B:", resultB);

    // 3. 逻辑判断
    let targetUrl = null;

    if (resultA.ok && resultB.ok) {
      // 两个都通，比较延迟
      targetUrl = resultA.time <= resultB.time ? resultA.url : resultB.url;
      statusEl.textContent = "线路均通畅，正在跳转最快线路...";
    } else if (resultA.ok) {
      // 只有 A 通
      targetUrl = resultA.url;
      statusEl.textContent = "检测完成，正在为您跳转...";
    } else if (resultB.ok) {
      // 只有 B 通
      targetUrl = resultB.url;
      statusEl.textContent = "检测完成，正在为您跳转...";
    } else {
      // 都不通
      loaderEl.classList.add("hidden");
      statusEl.textContent = "网络检测失败";
      detailEl.classList.add("hidden");
      errorMsgEl.classList.remove("hidden");
      return;
    }

    // 更新 UI 提示
    const delayA = resultA.ok ? Math.round(resultA.time) + 'ms' : '不可达';
    const delayB = resultB.ok ? Math.round(resultB.time) + 'ms' : '不可达';
    detailEl.innerHTML = `线路A: ${delayA} <br> 线路B: ${delayB}`;

    // 4. 执行跳转 (延迟 800ms 让用户看清结果)
    setTimeout(() => {
      window.location.replace(targetUrl);
    }, 800);
  }

  // 启动
  init();
})();
</script>
</body>
</html>
